name: Update product data

on:
  schedule:
    # First day of every month at 04:15 UTC.
    - cron: "15 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-product-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch, validate, and reduce product data
        run: node scripts/update-products.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Update product data"
          git push
